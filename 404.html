<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Tiny Bird, Big Dreams</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dark.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-page__inner { max-width: 520px; }
    .error-bird {
      font-size: 6rem;
      animation: wobble 2s ease-in-out infinite;
      display: block;
      margin-bottom: 8px;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }
    .error-code {
      font-family: var(--font-display);
      font-size: 8rem;
      line-height: 1;
      background: linear-gradient(135deg, var(--brand-orange), var(--brand-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0;
    }
    .error-page h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      margin-bottom: 16px;
    }
    .error-page p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 32px;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <nav class="nav" id="nav" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">
        <span class="logo-bird" aria-hidden="true">🐦</span>
        <span class="logo-text">Tiny Bird<span class="logo-accent">, Big Dreams</span></span>
      </a>
    </div>
  </nav>

  <main class="error-page">
    <div class="error-page__inner">
      <span class="error-bird" aria-hidden="true">🐦</span>
      <p class="error-code">404</p>
      <h1>This page flew the coop.</h1>
      <p>
        The page you're looking for doesn't exist — or maybe it dreamed so big it flew somewhere new.
        Either way, let's get you back on track.
      </p>
      <div class="error-links">
        <a href="index.html" class="btn btn--primary">← Back to Home</a>
        <a href="pages/about.html" class="btn btn--ghost">About Us</a>
        <a href="pages/contact.html" class="btn btn--ghost">Contact</a>
      </div>
    </div>
  </main>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <span class="theme-toggle__icon--light" aria-hidden="true">🌙</span>
    <span class="theme-toggle__icon--dark" aria-hidden="true">☀️</span>
  </button>
  <script src="js/main.js"></script>
</body>
</html>
