name: FlipFusion

options:
  bundleIdPrefix: com.tinybirdbigdreams
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  FlipFusion:
    type: application
    platform: iOS
    sources:
      - path: FlipFusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybirdbigdreams.flipfusion
        # iPhone only for 1.0.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: FlipFusion/Resources/Info.plist
      properties:
        CFBundleDisplayName: Flip Fusion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The game is always dark neon, whatever the phone's appearance setting.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Only system crypto: no export-compliance questions on each TestFlight upload.
        ITSAppUsesNonExemptEncryption: false

  FlipFusionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlipFusionTests
    dependencies:
      - target: FlipFusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybirdbigdreams.flipfusion.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FlipFusion:
    build:
      targets:
        FlipFusion: all
        FlipFusionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlipFusionTests
