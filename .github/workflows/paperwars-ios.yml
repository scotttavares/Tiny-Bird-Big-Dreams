name: Paper Wars iOS

# Builds and tests the Paper Wars iOS app (PaperWars/) on a macOS runner. Path-filtered so website-only changes never start a Mac job.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'PaperWars/**'
      - '.github/workflows/paperwars-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperwars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PaperWars
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devicetypes | grep -iE "duo|fold" || echo "No iPhone Duo simulator device type in this Xcode"

      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen

      - name: Build and test (zero warnings)
        run: scripts/ci.sh

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperwars-build
          path: |
            PaperWars/build/xcodebuild.log
            PaperWars/build/warnings.txt
            PaperWars/build/PaperWars.xcresult
          if-no-files-found: ignore
