name: Field Guide iOS

# Builds and tests the Field Guide iOS app (FieldGuide/) on a macOS runner and refreshes
# the posture screenshots. Path-filtered so website-only changes never start a Mac job.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'FieldGuide/**'
      - '.github/workflows/fieldguide-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldguide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, screenshots
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: FieldGuide
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devicetypes | grep -iE "duo|fold" || echo "No iPhone Duo simulator device type in this Xcode"

      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen

      - name: Build and test (zero warnings)
        run: scripts/ci.sh

      - name: Screenshots
        run: scripts/screenshots.sh

      - name: Commit refreshed screenshots
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FieldGuide/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Field Guide: refresh simulator screenshots [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldguide-build
          path: |
            FieldGuide/build/xcodebuild.log
            FieldGuide/build/warnings.txt
            FieldGuide/build/FieldGuide.xcresult
            FieldGuide/screenshots
          if-no-files-found: ignore
