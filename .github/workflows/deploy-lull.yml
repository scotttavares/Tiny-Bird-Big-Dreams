name: Deploy Lull Worker

# Deploys the lull-web static-assets Worker (lull.tinybirdbigdreams.com) from
# GitHub's runners, which have open network access to the Cloudflare API
# (this repo's other environments are egress-restricted from api.cloudflare.com).
# The app bundle is prebuilt at lull-web/public/assets/lull.js — no build step.
# Requires repository secret CLOUDFLARE_API_TOKEN
#   (perms: Workers Scripts: Edit, Workers Routes: Edit, DNS: Edit)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/youthful-cannon-lnxnuz]
    paths:
      - 'lull-web/**'
      - '.github/workflows/deploy-lull.yml'

jobs:
  deploy:
    name: Deploy & verify lull.tinybirdbigdreams.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deploy with wrangler v4 (Workers static assets + run_worker_first).
      # Use a native working-directory + npx (not wrangler-action) so the CWD is
      # exactly lull-web and the config is lull-web/wrangler.toml (assets ./public,
      # 13 files) — NOT the repo-root wrangler.jsonc (assets ".") — and so no
      # node_modules is created inside the asset tree.
      - name: Deploy Worker (wrangler deploy, static assets)
        working-directory: lull-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.104.0 deploy --config wrangler.toml

      - name: Verify live URLs (/, /app, /privacy)
        run: |
          set -uo pipefail
          check() {
            url="$1"; needle="$2"; code="000"; body=""
            for i in $(seq 1 24); do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || echo "000")
              body=$(cat /tmp/body 2>/dev/null || true)
              if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$needle"; then
                echo "OK    $url -> HTTP $code  (found: \"$needle\")"
                return 0
              fi
              # The tinybirdbigdreams.com zone serves a Cloudflare managed bot-challenge to
              # headless clients, so a real 200 is unreachable from CI. Treat the challenge as
              # "deployed but not headlessly verifiable" rather than a deploy failure.
              if printf '%s' "$body" | grep -qiE 'cdn-cgi/challenge-platform|_cf_chl_opt|Just a moment'; then
                echo "WARN  $url -> behind Cloudflare bot challenge (HTTP $code). Deploy OK; verify content in a browser."
                return 0
              fi
              echo "...wait $url -> HTTP $code (attempt $i/24; cert/propagation)"
              sleep 10
            done
            echo "FAIL  $url -> last HTTP $code; expected 200 containing \"$needle\" (no Cloudflare challenge detected)"
            echo "----- response head -----"
            printf '%s' "$body" | head -40
            return 1
          }
          rc=0
          check "https://lull.tinybirdbigdreams.com/"        "a minute to breathe" || rc=1
          check "https://lull.tinybirdbigdreams.com/app"     "lull.js"             || rc=1
          check "https://lull.tinybirdbigdreams.com/privacy" "Privacy Policy"      || rc=1
          if [ "$rc" = "0" ]; then echo "All checks passed."; fi
          exit "$rc"
