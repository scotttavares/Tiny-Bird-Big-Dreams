name: Deploy Lull Worker

# Deploys the standalone lull-site Cloudflare Worker (lull.tinybirdbigdreams.com)
# from GitHub's runners, which have open network access to the Cloudflare API.
# Requires a repository secret: CLOUDFLARE_API_TOKEN
#   (perms: Workers Scripts: Edit, Workers Routes: Edit, DNS: Edit)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/youthful-cannon-lnxnuz]
    paths:
      - 'lull-site/**'
      - '.github/workflows/deploy-lull.yml'

jobs:
  deploy:
    name: Deploy & verify lull.tinybirdbigdreams.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker (wrangler deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: lull-site

      - name: Verify live URLs (HTTP 200 + expected text)
        run: |
          set -uo pipefail
          check() {
            url="$1"; needle="$2"; code="000"; body=""
            # Retry up to ~4 min to absorb first-time SSL cert provisioning on the new custom domain.
            for i in $(seq 1 24); do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || echo "000")
              body=$(cat /tmp/body 2>/dev/null || true)
              if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$needle"; then
                echo "OK    $url -> HTTP $code  (found: \"$needle\")"
                return 0
              fi
              echo "...wait $url -> HTTP $code (attempt $i/24; cert/propagation)"
              sleep 10
            done
            echo "FAIL  $url -> last HTTP $code; expected 200 containing \"$needle\""
            echo "----- response head -----"
            printf '%s' "$body" | head -40
            return 1
          }
          rc=0
          check "https://lull.tinybirdbigdreams.com"         "a minute to breathe" || rc=1
          check "https://lull.tinybirdbigdreams.com/privacy"  "Privacy Policy"      || rc=1
          if [ "$rc" = "0" ]; then echo "All checks passed."; fi
          exit "$rc"
