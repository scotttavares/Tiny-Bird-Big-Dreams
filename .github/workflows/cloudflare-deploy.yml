name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment: Tiny
    steps:
      - uses: actions/checkout@v4

      # Deploy Worker first — secrets must be set AFTER deploy (Cloudflare error 10215)
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"

      # Upload secrets after deploy so the deployed version matches
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          TTBI_SERVICE_KEY: ${{ secrets.TTBI_SERVICE_KEY }}
          TS_SERVICE_KEY: ${{ secrets.TS_SERVICE_KEY }}
        run: |
          python3 -c "
          import json, os
          keys = ['STUDIO_PASSWORD', 'STRIPE_KEY', 'TTBI_SERVICE_KEY', 'TS_SERVICE_KEY']
          print(json.dumps({k: os.environ[k] for k in keys}))
          " | npx wrangler secret bulk --name tiny-bird-big-dreams
