name: Game Host iOS

# Builds and tests the Game Host iOS app (GameHost/) on a macOS runner and refreshes
# the posture screenshots. Path-filtered so website-only changes never start a Mac job.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'GameHost/**'
      - '.github/workflows/gamehost-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamehost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, screenshots
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: GameHost
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devicetypes | grep -iE "duo|fold" || echo "No iPhone Duo simulator device type in this Xcode"

      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen

      - name: Build and test (zero warnings)
        run: scripts/ci.sh

      - name: Screenshots
        timeout-minutes: 40
        run: scripts/screenshots.sh

      - name: Commit refreshed screenshots
        if: always() && github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameHost/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Game Host: refresh simulator screenshots [skip ci]"
            # The branch may have moved on while this run was building: replay onto it.
            for attempt in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
              sleep 5
            done
          fi

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamehost-build
          path: |
            GameHost/build/xcodebuild.log
            GameHost/build/warnings.txt
            GameHost/build/GameHost.xcresult
            GameHost/screenshots
          if-no-files-found: ignore
